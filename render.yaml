# Render Blueprint — Blue's ContactOut API
# 部署: Render Dashboard → New + → Blueprint → 选本仓库 → 填环境变量 → Apply
services:
  - type: web
    name: blue-co-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # —— 管理员口令: 逗号分隔可多个。后台管理 (创建客户口令/看用量) 用它 ——
      - key: ACCESS_TOKEN
        sync: false
      # —— 账号池: 10 个 ContactOut 账号的 cookie+userId 的 JSON 数组 ——
      - key: SESSIONS_JSON
        sync: false
      # —— 上游代理(可选但强烈建议): 逗号分隔多个, 每个 ip:port:user:pass (NovProxy ISP) ——
      # 让 contactout 请求走住宅/轮换代理, 规避 Render 机房 IP 被 Cloudflare 封 403; 留空=直连
      - key: CO_PROXY
        sync: false

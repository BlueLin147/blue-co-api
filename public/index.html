<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23274d80'/%3E%3Ctext x='8' y='24' fill='white' font-family='sans-serif' font-size='24' font-weight='600'%3EB%3C/text%3E%3C/svg%3E">
  <title>Blue 的关键决策人查询系统</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f8fa;
      --surface: #fff;
      --soft: #f8fafc;
      --ink: #222d3d;
      --muted: #667386;
      --line: #e4e9ef;
      --brand: #274d80;
      --brand-hover: #1e3d67;
      --link: #3d6093;
      --green: #39775b;
      --amber: #946519;
      --red: #b24949;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    button, a, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, .table-scroll:focus-visible { outline: 3px solid #b7cbea; outline-offset: 3px; }
    svg.icon { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
    .wrap { width: min(1160px, calc(100% - 64px)); margin: 0 auto; padding: 26px 0 54px; }
    .hero { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
    .logo { width: 42px; height: 42px; display: grid; place-items: center; flex-shrink: 0; background: var(--brand); border-radius: 11px; color: white; }
    .logo svg { width: 22px; height: 25px; }
    .heading { flex: 1; min-width: 0; }
    h1 { font-size: 23px; font-weight: 650; line-height: 1.35; letter-spacing: -.035em; margin: 0; }
    .subtitle { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
    .invite { margin: 7px 0 0; font-size: 13px; font-weight: 700; color: var(--brand); }
    .hero-tools { display: flex; gap: 14px; align-items: center; }
    .credits { display: flex; margin: 0; padding: 10px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
    .credit { padding: 0 21px; min-width: 128px; }
    .credit + .credit { border-left: 1px solid var(--line); }
    .credit dt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .credit dt .icon { width: 13px; height: 13px; }
    .credit dd { margin: 2px 0 0; color: var(--ink); font-size: 23px; line-height: 1.25; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--surface); }
    .icon-button:hover { color: var(--ink); background: #edf1f6; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 3px rgb(24 43 68 / 2%); overflow: hidden; }
    .input-content { padding: 21px 24px 20px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .input-hint { color: var(--muted); font-size: 12px; }
    #links { display: block; width: 100%; min-height: 116px; max-height: 320px; resize: vertical; padding: 12px 14px; border: 1px solid #e1e6ee; border-radius: 8px; background: var(--soft); color: #43516a; font: 12.5px/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none; transition: border-color .15s, box-shadow .15s; }
    #links::placeholder { color: #748197; opacity: 1; }
    #links:focus { background: white; border-color: #7395c2; box-shadow: 0 0 0 3px #eaf0f9; }
    .query-controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
    .query-buttons { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; height: 37px; padding: 0 14px; border: 1px solid #dde3eb; border-radius: 7px; background: white; color: #47566b; font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
    .button:hover:not(:disabled) { background: var(--soft); border-color: #bac6d6; }
    .button.primary { padding: 0 17px; background: var(--brand); color: white; border-color: var(--brand); }
    .button.primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
    .keyboard-hint { color: var(--muted); font-size: 11px; white-space: nowrap; }
    kbd { font: inherit; padding: 2px 5px; margin: 0 2px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
    .query-progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    progress { width: 96px; height: 4px; border: 0; border-radius: 9px; overflow: hidden; appearance: none; }
    progress::-webkit-progress-bar { background: #e8edf3; }
    progress::-webkit-progress-value { background: var(--brand); }
    progress::-moz-progress-bar { background: var(--brand); }
    .account-details { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; column-gap: 24px; row-gap: 8px; padding: 12px 24px; border-top: 1px solid #edf0f5; background: #fcfdfe; color: var(--muted); font-size: 12px; }
    .account-details[hidden] { display: none !important; }
    .detail-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .detail-label { color: #607087; }
    .detail-label small { font-size: 10px; margin-left: 4px; color: #798496; }
    .detail-value { white-space: nowrap; }
    .detail-value strong { color: #3b4a61; font-weight: 550; font-variant-numeric: tabular-nums; }
    .detail-separator { width: 1px; height: 10px; background: #dce3ec; }
    .results { margin-top: 21px; }
    .results-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 18px 24px; }
    .results-title { display: flex; gap: 10px; align-items: center; }
    .result-count { font-size: 11px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; }
    .result-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .result-actions .button { height: 32px; font-size: 12px; padding: 0 10px; }
    .result-actions .icon { width: 14px; height: 14px; }
    .button.quiet { border-color: transparent; background: transparent; }
    .table-hint { display: none; margin: 0; padding: 0 24px 12px; color: var(--muted); font-size: 11px; }
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; min-width: 1030px; table-layout: fixed; border-collapse: collapse; text-align: left; font-size: 13px; }
    col.row-index { width: 52px; }
    col.email-column { width: 258px; }
    col.phone-column { width: 194px; }
    col.status-column { width: 116px; }
    th { height: 39px; padding: 0 14px; border-block: 1px solid #edf0f5; background: #fafbfd; font-size: 11px; font-weight: 500; color: var(--muted); }
    td { padding: 13px 14px; border-bottom: 1px solid #edf0f5; line-height: 24px; vertical-align: top; }
    th:first-child, td:first-child { padding-left: 24px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcfe; }
    .row-number { color: #7b8798; font-size: 12px; font-variant-numeric: tabular-nums; }
    .profile-url { color: var(--link); font-size: 12.5px; overflow-wrap: anywhere; }
    .contact-value { display: flex; align-items: center; gap: 5px; min-height: 24px; color: #38475d; }
    .contact-value + .contact-value { margin-top: 3px; }
    .contact-value > span { overflow-wrap: anywhere; min-width: 0; }
    .phone-value > span { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .copy-button { width: 24px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border: 0; border-radius: 5px; background: transparent; color: #8c99aa; opacity: .5; }
    .copy-button .icon { width: 13px; height: 13px; }
    tr:hover .copy-button, .copy-button:focus-visible { opacity: 1; }
    .copy-button:hover { background: #eaf0f7; color: var(--brand); }
    .copy-button.copied { color: var(--green); opacity: 1; }
    .no-value { color: #8894a6; }
    .result-status { display: inline-flex; align-items: center; gap: 6px; padding: 0; margin: 0; font-size: 12px; font-weight: 400; line-height: 24px; white-space: nowrap; }
    .result-status::before { content: ""; width: 5px; height: 5px; flex-shrink: 0; border-radius: 50%; background: currentColor; }
    .result-status--found { color: var(--green); }
    .result-status--none { color: var(--amber); }
    .result-status--failed { color: var(--red); }
    td.table-empty { text-align: center; padding: 46px 24px; color: var(--muted); }
    .table-empty .icon { display: block; width: 28px; height: 28px; margin: 0 auto 10px; color: #95a5bb; }
    .table-empty strong { display: block; font-weight: 500; color: #51627a; }
    .table-empty p { margin: 3px 0 0; font-size: 12px; }
    .results-footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 13px 24px; border-top: 1px solid #edf0f5; color: var(--muted); font-size: 11px; }
    .run-status { display: flex; align-items: center; gap: 7px; }
    .run-status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #788aa1; }
    #toast { position: fixed; z-index: 20; bottom: 28px; left: 50%; transform: translate(-50%, 8px); max-width: calc(100% - 32px); width: max-content; padding: 11px 18px; background: #263b56; color: white; border-radius: 9px; font-size: 12px; box-shadow: 0 5px 20px #1c314b1a; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
    #toast.visible { opacity: 1; transform: translate(-50%, 0); }
    dialog { width: min(390px, calc(100% - 36px)); padding: 24px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); box-shadow: 0 18px 70px #17273c26; }
    dialog::backdrop { background: #182d4b45; }
    dialog h2 { font-size: 17px; }
    dialog p { color: var(--muted); font-size: 13px; }
    dialog label { display: block; font-size: 12px; margin-bottom: 7px; }
    dialog input { display: block; width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--soft); font-size: 12px; padding: 10px; }
    .dialog-status { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .dialog-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }
    @media (max-width: 1050px) {
      .hero { flex-wrap: wrap; }
      .hero-tools { width: 100%; margin-top: 6px; padding-left: 55px; }
      .credit { min-width: 160px; }
      .hero-tools .icon-button { margin-left: auto; }
      .keyboard-hint { display: none; }
      .table-hint { display: block; }
    }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 28px); padding-top: 18px; }
      .hero { gap: 11px; margin-bottom: 20px; }
      .logo { width: 34px; height: 36px; border-radius: 9px; }
      .logo svg { width: 18px; height: 21px; }
      h1 { font-size: 18px; letter-spacing: -.04em; }
      .subtitle { font-size: 11px; line-height: 1.7; }
      .hero-tools { padding-left: 0; gap: 10px; }
      .credits { flex: 1; }
      .credit { min-width: 0; flex: 1; padding: 0 14px; }
      .credit dd { font-size: 21px; }
      .input-content { padding: 17px 15px; }
      .section-heading { align-items: flex-start; }
      .input-hint { font-size: 10px; }
      #links { min-height: 122px; font-size: 16px; line-height: 1.6; padding: 10px; }
      .query-controls { flex-wrap: wrap; gap: 12px; }
      .query-buttons { width: 100%; gap: 6px; }
      .query-buttons .button { flex: 1; height: 42px; padding: 0 8px; font-size: 11px; gap: 5px; }
      .query-buttons .icon { width: 14px; height: 14px; }
      .query-progress { width: 100%; justify-content: flex-end; }
      .account-details { padding: 12px 15px; gap: 9px; }
      .detail-group { width: 100%; column-gap: 9px; font-size: 11px; }
      .detail-label { min-width: 61px; }
      .detail-label small { display: none; }
      .results-header { padding: 16px 15px; }
      .table-hint { padding-inline: 15px; }
      .result-actions { gap: 4px; width: 100%; }
      .result-actions .button { height: 36px; padding: 0 9px; }
      .results-footer { padding: 12px 15px; gap: 8px; font-size: 10px; }
    }
    @media (hover: none) { .copy-button { opacity: 1; width: 30px; height: 28px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="m8 3 2 5-2.5 2a15 15 0 0 0 6.5 6.5l2-2.5 5 2v3a2 2 0 0 1-2.2 2C10.5 20 4 13.5 3 5.2A2 2 0 0 1 5 3Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.8 2.8-2.9-.1-2.2 3.8 1.5 2.5-1.5 2.5 2.2 3.8 2.9-.1L9 21h6l.8-2.8 2.9.1 2.2-3.8-1.5-2.5 1.5-2.5-2.2-3.8-2.9.1L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12M3 15h18"/></symbol>
  </svg>

  <div class="wrap">
    <header class="hero">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 22 25" fill="none"><path d="M5 3v19h6.5a5 5 0 0 0 0-10H5h6a4.5 4.5 0 0 0 0-9H5Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="heading"><h1>关键决策人查询系统</h1><p class="subtitle">粘贴 LinkedIn 链接，查询邮箱与电话，轻松整理联系人。</p><p class="invite">欢迎联系免费给到批量的LinkedIn链接</p></div>
      <div class="hero-tools">
        <dl class="credits" aria-label="剩余额度">
          <div class="credit"><dt><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg><span id="emailCreditLabel">剩余邮箱额度</span></dt><dd id="emailCredit">--</dd></div>
          <div class="credit"><dt><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><span id="phoneCreditLabel">剩余电话额度</span></dt><dd id="phoneCredit">--</dd></div>
        </dl>
        <button class="icon-button" id="settingsButton" aria-label="设置" title="设置"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="inputTitle">
        <div class="input-content">
          <div class="section-heading"><h2 id="inputTitle"><label for="links">LinkedIn 链接</label></h2><span class="input-hint" id="inputHint">每行一个链接，可在逗号后添加姓名</span></div>
          <textarea id="links" aria-describedby="inputHint" spellcheck="false" placeholder="每行一个 LinkedIn 链接（可加姓名提高命中率，逗号分隔）&#10;https://www.linkedin.com/in/tahseenislam&#10;https://www.linkedin.com/in/holly-brown-7baa474a, Holly Brown&#10;也可以直接写：tahseenislam"></textarea>
          <div class="query-controls">
            <div class="query-buttons">
              <button class="button primary" id="goBoth"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>查邮箱+电话</button>
              <button class="button" id="goEmail"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>单查邮箱</button>
              <button class="button" id="goPhone"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>单查电话</button>
            </div>
            <span class="keyboard-hint" id="keyboardHint"><kbd>⌘</kbd><kbd>Enter</kbd> 运行查询</span>
            <div class="query-progress" id="queryProgress" hidden><span id="progressText" aria-live="polite"></span><progress id="progressBar" max="1" value="0" aria-label="查询进度"></progress></div>
          </div>
        </div>
        <div class="account-details" id="accountDetails" aria-label="额度明细与累计查询" hidden>
          <div class="detail-group"><span class="detail-label">我的额度<small>已用 / 总量</small></span><span class="detail-value">邮箱 <strong id="quotaEmail">--</strong></span><span class="detail-separator" aria-hidden="true"></span><span class="detail-value">电话 <strong id="quotaPhone">--</strong></span></div>
          <div class="detail-group"><span class="detail-label">累计查询</span><span class="detail-value">邮件 <strong id="totalEmail">--</strong> 条</span><span class="detail-separator" aria-hidden="true"></span><span class="detail-value">电话 <strong id="totalPhone">--</strong> 条</span></div>
        </div>
      </section>

      <section class="panel results" aria-labelledby="resultsTitle">
        <div class="results-header">
          <div class="results-title"><h2 id="resultsTitle">查询结果</h2><span class="result-count" id="resultCount">0 条</span></div>
          <div class="result-actions">
            <button class="button" id="exportButton"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>导出 CSV</button>
            <button class="button quiet" id="copyAllButton"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>复制全部邮箱</button>
            <button class="button quiet" id="clearButton"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>清空</button>
          </div>
        </div>
        <p class="table-hint">左右滑动表格，查看邮箱、电话与状态</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="查询结果表格，窄屏可左右滚动">
          <table aria-label="查询结果">
            <colgroup><col class="row-index"><col><col class="email-column"><col class="phone-column"><col class="status-column"></colgroup>
            <thead><tr><th scope="col">#</th><th scope="col">LinkedIn</th><th scope="col">邮箱</th><th scope="col">电话</th><th scope="col">状态</th></tr></thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
        <footer class="results-footer"><span class="run-status" id="runStatus" role="status">就绪</span><span id="resultSummary">暂无结果</span></footer>
      </section>
    </main>

  </div>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">访问设置</h2>
    <p>填写访问口令后即可查询邮箱与电话，口令保存在本机浏览器。</p>
    <label for="tokenInput">访问口令</label>
    <input id="tokenInput" type="password" autocomplete="off" placeholder="输入口令，如 co_xxxxxxxx">
    <div class="dialog-status" id="tokenStatus"></div>
    <div class="dialog-actions"><button class="button" id="tokenClear">清除</button><button class="button primary" id="tokenSave">保存</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    let TOKEN = localStorage.getItem('co_token') || '';
    const statusLabels = { found: '已查', none: '无结果', failed: '额度不足' };
    const body = document.getElementById('resultBody');
    const queryButtons = [document.getElementById('goBoth'), document.getElementById('goEmail'), document.getElementById('goPhone')];
    const exportButton = document.getElementById('exportButton');
    const copyAllButton = document.getElementById('copyAllButton');
    const clearButton = document.getElementById('clearButton');
    let rows = [];
    let running = false;
    let toastTimer;

    function icon(name) { return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
    function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
    function notify(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
    }
    function headers() { return TOKEN ? { 'Content-Type': 'application/json', 'x-co-token': TOKEN } : { 'Content-Type': 'application/json' }; }
    async function api(path, opts, quiet) {
      const r = await fetch(path, Object.assign({ headers: headers() }, opts || {}));
      const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {}
      if (r.status === 401) {
        if (!quiet) {
          openSettings();
          document.getElementById('tokenStatus').textContent = '口令无效或未设置，请填写正确口令';
        }
        throw new Error('未授权');
      }
      if (!r.ok) throw new Error((j && (j.error || j.msg)) || ('HTTP ' + r.status));
      return j;
    }
    function fmt(v) { return Number(v).toLocaleString('en-US'); }
    async function refreshCredits() {
      try {
        const j = await api('/api/credits', {}, true);
        const me = j.me;
        if (j.is_master) {
          document.getElementById('emailCredit').textContent = fmt(j.total_email_credit);
          document.getElementById('phoneCredit').textContent = fmt(j.total_phone_credit);
          document.getElementById('emailCreditLabel').textContent = '账号池剩余邮箱';
          document.getElementById('phoneCreditLabel').textContent = '账号池剩余电话';
        } else if (me) {
          document.getElementById('emailCredit').textContent = me.email_limit > 0 ? fmt(Math.max(0, me.email_limit - me.email_used)) : '∞';
          document.getElementById('phoneCredit').textContent = me.phone_limit > 0 ? fmt(Math.max(0, me.phone_limit - me.phone_used)) : '∞';
          document.getElementById('emailCreditLabel').textContent = '我的每日邮箱额度';
          document.getElementById('phoneCreditLabel').textContent = '我的每日电话额度';
        }
        const details = document.getElementById('accountDetails');
        if (me) {
          details.hidden = false;
          document.getElementById('quotaEmail').textContent = me.email_used + ' / ' + (me.email_limit > 0 ? me.email_limit : '∞');
          document.getElementById('quotaPhone').textContent = me.phone_used + ' / ' + (me.phone_limit > 0 ? me.phone_limit : '∞');
          document.getElementById('totalEmail').textContent = fmt(me.email_total || 0);
          document.getElementById('totalPhone').textContent = fmt(me.phone_total || 0);
        } else {
          details.hidden = true;
        }
      } catch (e) {
        document.getElementById('emailCredit').textContent = '--';
        document.getElementById('phoneCredit').textContent = '--';
      }
    }
    function parseInput() {
      return document.getElementById('links').value.split(/\n/).map(s => s.trim()).filter(Boolean);
    }
    function normEmails(list) {
      if (!list) return [];
      return list.map(e => typeof e === 'string' ? e : (e && e.value) || '').filter(Boolean);
    }
    function normPhones(list) {
      if (!list) return [];
      return list.map(p => typeof p === 'string' ? p : (p && p.value) || '').filter(Boolean);
    }
    function statusLabel(row) {
      if (row.status !== 'failed') return statusLabels[row.status];
      if (row.credit) return '额度不足';
      return row.error || '失败';
    }
    function contacts(values, kind) {
      if (!values.length) return '<span class="no-value">—</span>';
      const label = kind === 'email' ? '邮箱' : '电话';
      return values.map(value => '<div class="contact-value ' + kind + '-value"><span>' + escapeHtml(value) + '</span><button class="copy-button" data-copy="' + escapeHtml(value) + '" aria-label="复制' + label + ' ' + escapeHtml(value) + '" title="复制' + label + '">' + icon('copy') + '</button></div>').join('');
    }
    function render() {
      body.innerHTML = rows.length ? rows.map((row, index) => '<tr><td class="row-number">' + (index + 1) + '</td><td class="profile-url">' + escapeHtml(row.profile) + '</td><td>' + contacts(row.emails, 'email') + '</td><td>' + contacts(row.phones, 'phone') + '</td><td><span class="result-status result-status--' + row.status + '" title="' + escapeHtml(row.error || statusLabel(row)) + '">' + escapeHtml(statusLabel(row)) + '</span></td></tr>').join('') : '<tr><td colspan="5" class="table-empty">' + icon('table') + '<strong>' + (running ? '正在查询' : '还没有查询结果') + '</strong><p>' + (running ? '结果即将显示' : '粘贴 LinkedIn 链接，点击「查邮箱+电话」开始查询') + '</p></td></tr>';
      document.getElementById('resultCount').textContent = rows.length + ' 条';
      document.getElementById('resultSummary').textContent = rows.length ? '已查 ' + rows.filter(row => row.status === 'found').length + ' · 无结果 ' + rows.filter(row => row.status === 'none').length + ' · 失败 ' + rows.filter(row => row.status === 'failed').length : '暂无结果';
      exportButton.disabled = running || !rows.length;
      copyAllButton.disabled = running || !rows.some(row => row.emails.length);
      clearButton.disabled = running || !rows.length;
    }
    async function copy(value, button) {
      try {
        await navigator.clipboard.writeText(value);
        notify('已复制到剪贴板');
        if (button) {
          button.classList.add('copied');
          button.innerHTML = icon('check');
          setTimeout(() => { button.classList.remove('copied'); button.innerHTML = icon('copy'); }, 1600);
        }
      } catch {
        notify('浏览器未允许复制，可选中文字手动复制');
      }
    }
    function setButtonsDisabled(disabled) { queryButtons.forEach(button => { button.disabled = disabled; }); }
    async function run(mode) {
      if (running) return;
      const urls = parseInput();
      if (!urls.length) { notify('请先粘贴 LinkedIn 链接'); return; }
      running = true;
      rows = [];
      setButtonsDisabled(true);
      const progress = document.getElementById('queryProgress');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      progress.hidden = false;
      document.getElementById('keyboardHint').hidden = true;
      progressBar.max = urls.length;
      progressBar.value = 0;
      progressText.textContent = '0 / ' + urls.length;
      document.getElementById('runStatus').textContent = '查询中';
      render();
      try {
        for (let i = 0; i < urls.length; i++) {
          progressBar.value = i + 1;
          progressText.textContent = (i + 1) + ' / ' + urls.length;
          try {
            const path = mode === 'email' ? '/api/reveal' : mode === 'phone' ? '/api/phone' : '/api/find';
            const j = await api(path, { method: 'POST', body: JSON.stringify({ profile_url: urls[i] }) });
            const d = j.data || {};
            const emails = normEmails(d.emails);
            const phones = normPhones(d.phones && d.phones.length ? d.phones : (d.phone ? [d.phone] : []));
            rows.push({ profile: urls[i], emails, phones, status: emails.length || phones.length ? 'found' : 'none' });
          } catch (e) {
            const credit = /额度|credit|limit|上限/i.test(e.message);
            rows.push({ profile: urls[i], emails: [], phones: [], status: 'failed', error: e.message, credit });
          }
          render();
          refreshCredits();
        }
      } finally {
        running = false;
        setButtonsDisabled(false);
        progress.hidden = true;
        document.getElementById('keyboardHint').hidden = false;
        document.getElementById('runStatus').textContent = '查询完成';
        render();
        refreshCredits();
      }
    }
    body.addEventListener('click', event => {
      const button = event.target.closest('[data-copy]');
      if (button) copy(button.dataset.copy, button);
    });
    copyAllButton.addEventListener('click', () => {
      const emails = [...new Set(rows.flatMap(row => row.emails))];
      if (!emails.length) { notify('没有邮箱可复制'); return; }
      copy(emails.join('\n'));
    });
    exportButton.addEventListener('click', () => {
      const values = [['LinkedIn', 'Email', 'Phone'], ...rows.map(row => [row.profile, row.emails.join('; '), row.phones.join('; ')])];
      const csv = '\ufeff' + values.map(row => row.map(value => '"' + String(value).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = '关键决策人_结果_' + new Date().toLocaleString('zh-CN', { hour12: false }).replace(/[\/: ]/g, '-') + '.csv';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      notify('已导出 ' + rows.length + ' 条结果');
    });
    clearButton.addEventListener('click', () => {
      rows = [];
      render();
      document.getElementById('runStatus').textContent = '就绪';
    });
    const dialog = document.getElementById('settingsDialog');
    const tokenInput = document.getElementById('tokenInput');
    function openSettings() {
      tokenInput.value = TOKEN;
      document.getElementById('tokenStatus').textContent = TOKEN ? '当前已设置口令' : '未设置口令';
      if (!dialog.open) dialog.showModal();
      setTimeout(() => tokenInput.focus(), 50);
    }
    document.getElementById('settingsButton').addEventListener('click', openSettings);
    document.getElementById('tokenSave').addEventListener('click', () => {
      const v = tokenInput.value.trim();
      TOKEN = v;
      if (v) { localStorage.setItem('co_token', v); document.getElementById('tokenStatus').textContent = '已保存'; }
      else { localStorage.removeItem('co_token'); document.getElementById('tokenStatus').textContent = '已清除'; }
      refreshCredits();
      setTimeout(() => dialog.close(), 500);
    });
    document.getElementById('tokenClear').addEventListener('click', () => {
      TOKEN = '';
      localStorage.removeItem('co_token');
      tokenInput.value = '';
      document.getElementById('tokenStatus').textContent = '已清除';
      refreshCredits();
    });
    dialog.addEventListener('click', event => { if (event.target === dialog && (event.offsetX < 0 || event.offsetX > dialog.clientWidth || event.offsetY < 0 || event.offsetY > dialog.clientHeight)) dialog.close(); });
    document.getElementById('goBoth').addEventListener('click', () => run('both'));
    document.getElementById('goEmail').addEventListener('click', () => run('email'));
    document.getElementById('goPhone').addEventListener('click', () => run('phone'));
    document.getElementById('links').addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); run('both'); }
    });
    render();
    refreshCredits();
  </script>
</body>
</html>
